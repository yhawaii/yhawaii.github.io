<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <script src="https://cdn.tailwindcss.com"></script>
	
	<script>
		var _hmt = _hmt || [];
		(function() {
		  var hm = document.createElement("script");
		  hm.src = "https://hm.baidu.com/hm.js?063de1909c153f613189bfb9bcac097e";
		  var s = document.getElementsByTagName("script")[0]; 
		  s.parentNode.insertBefore(hm, s);
		})();
	</script>
  </head>

  <body>
    <div id="app">
      <div
        class="flex flex-col items-start w-full items-center justify-center align-middle"
      >
        <div class="text-xl my-4">Data Receiver Mode</div>
        <div class="text-sm mb-4">{{user_message}}</div>

        <!-- Progress display -->
        <div v-if="metadata_initialized" class="text-sm mb-4">
          <div>Progress: {{progress_text}}</div>
          <div class="flex flex-wrap gap-1 mt-2 justify-center">
            <span v-for="i in file_metadata.chunks" :key="i"
                  :class="getChunkClass(i-1)"
                  class="w-5 h-5 text-xs flex items-center justify-center rounded">
            </span>
          </div>
          <div v-if="missing_text" class="text-xs mt-2 text-gray-500">
            Missing: {{missing_text}}
          </div>
        </div>

        <!-- Validation result -->
        <div v-if="validation_result" class="text-sm mb-4 p-2 border"
             :class="validation_result.success ? 'border-green-500 bg-green-50' : 'border-red-500 bg-red-50'">
          <div v-if="validation_result.success">
            ✅ File received successfully!<br>
            Name: {{validation_result.name}}<br>
            Size: {{validation_result.size}} bytes<br>
            Hash: {{validation_result.hash}}
          </div>
          <div v-else>
            ❌ Error: {{validation_result.error}}
          </div>
        </div>

        <button
          v-if="!is_receiving"
          v-on:click="start_receiver"
          class="mb-6 p-1 border-2 border-gray-500"
        >
          Start Receiver
        </button>
        <button
          v-else
          v-on:click="stop_receiver"
          class="mb-6 p-1 border-2 border-gray-500"
        >
          Stop Receiver
        </button>
        <video id="videoElement" muted autoplay playsinline></video>
      </div>
    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@latest/dist/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.0.3/pako.min.js"></script>
    <script>
      const { createApp, ref, reactive, onMounted, computed } = Vue;

      createApp({
        setup() {
          const user_message = ref("Click receive button to start receiving");
          const decoded_chunks = ref({});
          const file_metadata = reactive({});
          const is_receiving = ref(false);
          const metadata_initialized = ref(false);
          const protocol_version = ref(null);
          const chunk_status = ref({});
          const progress_text = ref("");
          const validation_result = ref(null);
          const missing_text = ref("");
          let canvas, context, videoElement;

          // CRC32 implementation
          const makeCRCTable = () => {
            let c, table = [];
            for (let n = 0; n < 256; n++) {
              c = n;
              for (let k = 0; k < 8; k++) {
                c = ((c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1));
              }
              table[n] = c;
            }
            return table;
          };

          let crc_table = null;
          const crc32 = (data) => {
            if (!crc_table) crc_table = makeCRCTable();
            let crc = 0xFFFFFFFF;
            for (let i = 0; i < data.length; i++) {
              crc = (crc >>> 8) ^ crc_table[(crc ^ data[i]) & 0xFF];
            }
            return (crc ^ 0xFFFFFFFF) >>> 0;
          };

          const computeChunkChecksum = (chunk) => {
            return crc32(chunk).toString(16).padStart(8, '0');
          };

          // Reliable metadata detection
          const isMetadataFrame = (decoded_data) => {
            try {
              const parsed = JSON.parse(decoded_data);
              // v2 format: has v field
              if (parsed.v === 2 && parsed.name !== undefined && parsed.chunks !== undefined && parsed.hash !== undefined) {
                return { isMetadata: true, version: 2, data: parsed };
              }
              // v1 format (legacy): has chunks but no v field
              if (parsed.name !== undefined && parsed.chunks !== undefined && parsed.v === undefined) {
                return { isMetadata: true, version: 1, data: parsed };
              }
            } catch (e) {
              // Not valid JSON
            }
            return { isMetadata: false, version: null, data: null };
          };

          // Parse data frame with version detection
          const parseDataFrame = (decoded_data) => {
            // v2 format: "v2:index:checksum,base64_data"
            if (decoded_data.startsWith("v2:")) {
              const match = decoded_data.match(/^v2:(\d+):([0-9a-f]{8}),(.+)$/);
              if (match) {
                return {
                  version: 2,
                  index: parseInt(match[1]),
                  checksum: match[2],
                  base64Data: match[3]
                };
              }
            }

            // v1 format (legacy): "index,base64_data"
            const commaIndex = decoded_data.indexOf(",");
            if (commaIndex > 0) {
              const indexPart = decoded_data.substring(0, commaIndex);
              if (/^\d+$/.test(indexPart)) {
                return {
                  version: 1,
                  index: parseInt(indexPart),
                  checksum: null,
                  base64Data: decoded_data.substring(commaIndex + 1)
                };
              }
            }

            return null;
          };

          // Decode base64 data to Uint8Array (v2: direct, no expansion)
          const decode_data_v2 = (base64_data) => {
            const binary_string = atob(base64_data);
            const bytes = new Uint8Array(binary_string.length);
            for (let i = 0; i < binary_string.length; i++) {
              bytes[i] = binary_string.charCodeAt(i);
            }
            return bytes;
          };

          // Decode base64 data for v1 legacy format (with Latin1→UTF8 expansion)
          const decode_data_v1 = (base64_data) => {
            const encoded_data = atob(base64_data);
            const encoded_array = new Uint8Array(encoded_data.length);
            for (let i = 0; i < encoded_data.length; i++) {
              encoded_array[i] = encoded_data.charCodeAt(i);
            }
            const utf8Decoder = new TextDecoder();
            const output_string = utf8Decoder.decode(encoded_array);
            const bytes = new Uint8Array(output_string.length);
            for (let i = 0; i < output_string.length; i++) {
              bytes[i] = output_string.charCodeAt(i);
            }
            return bytes;
          };

          // Validate chunk checksum (for v2 format)
          const validateChunk = (data_array, expected_checksum) => {
            const actual_checksum = computeChunkChecksum(data_array);
            return actual_checksum === expected_checksum;
          };

          // Check if all chunks 0 to N-1 are present
          const checkCompleteness = (chunks, total_chunks) => {
            if (total_chunks <= 0) return false;
            for (let i = 0; i < total_chunks; i++) {
              if (!chunks.hasOwnProperty(i) || chunk_status.value[i] !== 'valid') {
                return false;
              }
            }
            return true;
          };

          // Get missing chunk indices for display
          const getMissingChunks = (chunks, total_chunks) => {
            const missing = [];
            for (let i = 0; i < total_chunks; i++) {
              if (!chunks.hasOwnProperty(i) || chunk_status.value[i] !== 'valid') {
                missing.push(i);
              }
            }
            return missing;
          };

          // Validate reconstructed file against expected hash
          const validateFileHash = (inflated_data, expected_hash) => {
            const actual_hash = crc32(inflated_data).toString(16).padStart(8, '0');
            return actual_hash === expected_hash;
          };

          const download_file = (data, fileName) => {
            const blob = new Blob([data]);
            const dummy_element = document.createElement("a");
            const url = URL.createObjectURL(blob);
            dummy_element.href = url;
            dummy_element.download = fileName;
            dummy_element.click();
            URL.revokeObjectURL(url);
          };

          const resetState = () => {
            decoded_chunks.value = {};
            chunk_status.value = {};
            Object.assign(file_metadata, {});
            metadata_initialized.value = false;
            protocol_version.value = null;
            progress_text.value = "";
            missing_text.value = "";
            validation_result.value = null;
            user_message.value = "Click receive button to start receiving";
          };

          const stop_receiver = () => {
            is_receiving.value = false;
            resetState();
          };

          const updateProgressDisplay = () => {
            const received = Object.keys(chunk_status.value).filter(
              k => chunk_status.value[k] === 'valid'
            ).length;
            const total = file_metadata.chunks || 0;
            const invalid = Object.keys(chunk_status.value).filter(
              k => chunk_status.value[k] === 'invalid'
            ).length;

            progress_text.value = `${received}/${total} chunks received`;
            if (invalid > 0) {
              progress_text.value += ` (${invalid} invalid)`;
            }

            const missing = getMissingChunks(decoded_chunks.value, total);
            if (missing.length > 0 && missing.length <= 20) {
              missing_text.value = missing.join(", ");
            } else if (missing.length > 20) {
              missing_text.value = `${missing.length} chunks remaining`;
            } else {
              missing_text.value = "";
            }
          };

          const getChunkClass = (index) => {
            const status = chunk_status.value[index];
            if (status === 'valid') return 'bg-green-500';
            if (status === 'invalid') return 'bg-red-500';
            return 'bg-gray-300';
          };

          const reconstructAndDownload = async () => {
            user_message.value = "Reconstructing file...";

            // Calculate total size from metadata
            const total_size = file_metadata.size || 0;

            // Assemble chunks using pre-allocated Uint8Array (no concat)
            let total_compressed_size = 0;
            for (let i = 0; i < file_metadata.chunks; i++) {
              total_compressed_size += decoded_chunks.value[i].length;
            }

            let output_uint8array = new Uint8Array(total_compressed_size);
            let offset = 0;
            for (let i = 0; i < file_metadata.chunks; i++) {
              output_uint8array.set(decoded_chunks.value[i], offset);
              offset += decoded_chunks.value[i].length;
            }

            // Decompress
            let inflated_array;
            try {
              inflated_array = pako.inflate(output_uint8array);
            } catch (e) {
              user_message.value = "Error: Decompression failed";
              validation_result.value = { success: false, error: "Decompression failed" };
              return;
            }

            // Validate file hash (v2 protocol)
            if (protocol_version.value === 2 && file_metadata.hash) {
              if (!validateFileHash(inflated_array, file_metadata.hash)) {
                user_message.value = "Error: File hash mismatch";
                validation_result.value = { success: false, error: "Hash mismatch - file may be corrupted" };
                return;
              }
            }

            // Validate file size (v2 protocol)
            if (protocol_version.value === 2 && file_metadata.size !== undefined) {
              if (inflated_array.length !== file_metadata.size) {
                user_message.value = "Error: File size mismatch";
                validation_result.value = { success: false, error: `Size mismatch: expected ${file_metadata.size}, got ${inflated_array.length}` };
                return;
              }
            }

            // Success
            user_message.value = "Transfer complete!";
            validation_result.value = {
              success: true,
              name: file_metadata.name,
              size: inflated_array.length,
              hash: protocol_version.value === 2 ? file_metadata.hash : "N/A (v1 protocol)"
            };

            download_file(inflated_array, file_metadata.name);
            is_receiving.value = false;
          };

          const start_receiver = async () => {
            resetState();
            is_receiving.value = true;
            user_message.value = "Scanning for QR codes...";

            while (is_receiving.value) {
              try {
                await new Promise((r) => setTimeout(r, 10));
                context.drawImage(videoElement, 0, 0);
                let image_data = context.getImageData(
                  0,
                  0,
                  canvas.width,
                  canvas.height
                );
                let symbols = await zbarWasm.scanImageData(image_data);
                if (!symbols || !symbols.length) {
                  continue;
                }

                // Process all detected QR codes
                for (let s = 0; s < symbols.length; s++) {
                  let decoded_data = symbols[s].decode();

                  // Try to parse as metadata frame
                  const metaResult = isMetadataFrame(decoded_data);

                  if (metaResult.isMetadata) {
                    // Only reset if this is a different file
                    const isNewFile = !metadata_initialized.value ||
                      file_metadata.name !== metaResult.data.name ||
                      (metaResult.data.hash && file_metadata.hash !== metaResult.data.hash);

                    if (isNewFile) {
                      decoded_chunks.value = {};
                      chunk_status.value = {};
                      Object.assign(file_metadata, metaResult.data);
                      metadata_initialized.value = true;
                      protocol_version.value = metaResult.version;
                      user_message.value = `Receiving: ${file_metadata.name}`;
                      updateProgressDisplay();
                    }
                    // Same file metadata: skip, don't clear progress
                    continue;
                  }

                  // Try to parse as data frame
                  const dataFrame = parseDataFrame(decoded_data);
                  if (!dataFrame) continue;

                  // Skip if metadata not initialized yet
                  if (!metadata_initialized.value) continue;

                  const { index, version, checksum, base64Data } = dataFrame;

                  // Skip out-of-range chunks
                  if (index < 0 || index >= file_metadata.chunks) continue;

                  // Skip if already have valid chunk
                  if (chunk_status.value[index] === 'valid') continue;

                  // Decode the chunk data (use version-specific decoder)
                  let data_array;
                  try {
                    if (version === 2) {
                      data_array = decode_data_v2(base64Data);
                    } else {
                      data_array = decode_data_v1(base64Data);
                    }
                  } catch (e) {
                    console.error(`Failed to decode chunk ${index}:`, e);
                    chunk_status.value[index] = 'invalid';
                    continue;
                  }

                  // Validate checksum for v2 protocol
                  if (version === 2 && checksum) {
                    if (validateChunk(data_array, checksum)) {
                      decoded_chunks.value[index] = data_array;
                      chunk_status.value[index] = 'valid';
                    } else {
                      console.warn(`Chunk ${index} checksum mismatch`);
                      chunk_status.value[index] = 'invalid';
                      // Keep scanning, will retry on next loop
                    }
                  } else {
                    // v1 protocol - no checksum, trust the data
                    decoded_chunks.value[index] = data_array;
                    chunk_status.value[index] = 'valid';
                  }

                  updateProgressDisplay();

                  // Check completeness
                  if (checkCompleteness(decoded_chunks.value, file_metadata.chunks)) {
                    await reconstructAndDownload();
                    return;
                  }
                }
              } catch (error) {
                console.error("Error in Loop: ", error);
              }
            }

            // User stopped receiver
            resetState();
          };

          onMounted(async () => {
            console.log("Application Initialized ...");
            videoElement = document.getElementById("videoElement");
            videoElement.srcObject = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: "environment" },
            });
            canvas = document.createElement("canvas");
            context = canvas.getContext("2d");
            await new Promise((r) => setTimeout(r, 2000));
            canvas.height = videoElement.videoHeight;
            canvas.width = videoElement.videoWidth;
            context.drawImage(videoElement, 0, 0);
          });

          return {
            user_message,
            start_receiver,
            is_receiving,
            file_metadata,
            decoded_chunks,
            stop_receiver,
            metadata_initialized,
            progress_text,
            missing_text,
            validation_result,
            getChunkClass,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
